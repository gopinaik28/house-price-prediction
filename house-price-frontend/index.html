<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Predictor</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            background: #4f46e5;
            color: white;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #4338ca;
        }

        .result {
            margin-top: 25px;
            text-align: center;
            padding: 20px;
            background: #f3f4f6;
            border-radius: 12px;
        }

        .price {
            font-size: 32px;
            font-weight: bold;
            color: #16a34a;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>🏠 House Price Predictor</h1>

        <div class="input-group">
            <label>Area (sq ft)</label>
            <input type="number" id="area">
        </div>

        <div class="input-group">
            <label>Bedrooms</label>
            <input type="number" id="bedrooms">
        </div>

        <div class="input-group">
            <label>Bathrooms</label>
            <input type="number" id="bathrooms">
        </div>

        <div class="input-group">
            <label>Parking Spaces</label>
            <input type="number" id="parking">
        </div>

        <button onclick="predictPrice()">
            Predict Price
        </button>

        <div class="result">
            <h3>Estimated Price</h3>
            <div class="price" id="result">
                ₹ --
            </div>
        </div>

    </div>

    <script>

        async function predictPrice() {

            const area = document.getElementById("area").value;
            const bedrooms = document.getElementById("bedrooms").value;
            const bathrooms = document.getElementById("bathrooms").value;
            const parking = document.getElementById("parking").value;

            if (
                !area ||
                !bedrooms ||
                !bathrooms ||
                !parking
            ) {
                alert("Please fill all fields");
                return;
            }

            try {

                const response = await fetch(
    `https://house-price-prediction-s0jt.onrender.com/predict?area=${area}&bedrooms=${bedrooms}&bathrooms=${bathrooms}&parking=${parking}`
);

                const data = await response.json();

                document.getElementById("result").innerHTML =
                    "₹ " +
                    Number(data.predicted_price).toLocaleString("en-IN");

            } catch (error) {

                document.getElementById("result").innerHTML =
                    "Error connecting to API";

                console.error(error);
            }
        }

    </script>

</body>

</html>
